version: 2.1

workflows:
  test_all_PHP_and_Laravel_versions:
    jobs:
      - tests:
          matrix:
            # Package only supports Laravel 9 & 10 (PHP 7.4 and Laravel 5.8-8.0 dropped).
            parameters:
              php: [php-80, php-81]
              laravel: ["9.0", "10.0"]
            exclude:
              # Laravel 10 requires PHP ^8.1; Laravel 9 runs on both 8.0 and 8.1.
              - { php: php-80, laravel: "10.0" }

executors:
  php-80:
    docker:
      - image: cimg/php:8.0
      - image: cimg/mysql:5.7
        environment:
          MYSQL_DATABASE: forge
    resource_class: medium+
  php-81:
    docker:
      - image: cimg/php:8.1
      - image: cimg/mysql:5.7
        environment:
          MYSQL_DATABASE: forge
    resource_class: medium+

jobs:
  tests:
    parameters:
      php:
        type: executor
      laravel:
        type: string
    executor: << parameters.php >>

    steps:
      - checkout

      - restore_cache:
          key: v1-dependencies-{{ checksum "composer.json" }}-<< parameters.laravel >>

      - run:
          name: Install Composer dependencies
          command: |
            composer require \
              "illuminate/bus=^<< parameters.laravel >>" \
              "illuminate/console=^<< parameters.laravel >>" \
              "illuminate/contracts=^<< parameters.laravel >>" \
              "illuminate/database=^<< parameters.laravel >>" \
              "illuminate/queue=^<< parameters.laravel >>" \
              "illuminate/support=^<< parameters.laravel >>" \
              --no-update
            composer update --prefer-dist --no-interaction --no-progress

      - save_cache:
          key: v1-dependencies-{{ checksum "composer.json" }}-<< parameters.laravel >>
          paths:
            - ./vendor

      - run:
          name: Run PHPUnit tests
          command: phpdbg -qrr  vendor/bin/phpunit --configuration phpunit.xml.dist --coverage-html build/coverage-report --log-junit build/junit.xml
          environment:
            DB_HOST: 127.0.0.1
            DB_USERNAME: root

      - store_test_results:
          path: build

      - store_artifacts:
          path: build
