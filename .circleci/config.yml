version: 2.1

workflows:
  test_all_PHP_and_Laravel_versions:
    jobs:
      - tests:
          matrix:
            # Package only supports Laravel 10 & 11 (PHP 8.0 and Laravel 9 dropped).
            parameters:
              php: [php-81, php-82, php-83]
              laravel: ["10.0", "11.0"]
            exclude:
              # Laravel 11 requires PHP ^8.2; Laravel 10 runs on 8.1, 8.2 and 8.3.
              - { php: php-81, laravel: "11.0" }

executors:
  php-81:
    docker:
      - image: cimg/php:8.1
      - image: cimg/mysql:5.7
        environment:
          MYSQL_DATABASE: forge
    resource_class: medium+
  php-82:
    docker:
      - image: cimg/php:8.2
      - image: cimg/mysql:5.7
        environment:
          MYSQL_DATABASE: forge
    resource_class: medium+
  php-83:
    docker:
      - image: cimg/php:8.3
      - image: cimg/mysql:5.7
        environment:
          MYSQL_DATABASE: forge
    resource_class: medium+

jobs:
  tests:
    parameters:
      php:
        type: executor
      laravel:
        type: string
    executor: << parameters.php >>

    steps:
      - checkout

      - run:
          name: Snapshot composer.json for cache key
          command: cp composer.json composer.json.snapshot

      - restore_cache:
          key: v3-dependencies-<< parameters.php >>-<< parameters.laravel >>-{{ checksum "composer.json.snapshot" }}

      - run:
          name: Install Composer dependencies
          command: |
            composer require \
              "illuminate/bus=^<< parameters.laravel >>" \
              "illuminate/console=^<< parameters.laravel >>" \
              "illuminate/contracts=^<< parameters.laravel >>" \
              "illuminate/database=^<< parameters.laravel >>" \
              "illuminate/queue=^<< parameters.laravel >>" \
              "illuminate/support=^<< parameters.laravel >>" \
              --no-update
            composer update --prefer-dist --no-interaction --no-progress
          environment:
            # Composer >=2.9 refuses to install versions with known security advisories, which blocks
            # every Laravel 10/11 release. Only affects this package's own test install, not consumers.
            # TODO: On each Laravel upgrade, try removing this (here and in docker-compose.yaml).
            #       If `composer update` succeeds without it for every Laravel version in the range, delete it.
            COMPOSER_NO_BLOCKING: "1"

      - save_cache:
          key: v3-dependencies-<< parameters.php >>-<< parameters.laravel >>-{{ checksum "composer.json.snapshot" }}
          paths:
            - ./vendor

      - run:
          name: Install pcov for code coverage
          # cimg/php only scans PHP_CONFIG_FILE_SCAN_DIR (/etc/php.d), where the installer doesn't
          # write its ini, so enable pcov there explicitly and fail fast if it still isn't loaded.
          command: |
            sudo -E install-php-extensions pcov
            echo "extension=pcov.so" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/pcov.ini"
            php -m | grep -qi '^pcov$'

      - run:
          name: Run PHPUnit tests
          command: php vendor/bin/phpunit --configuration phpunit.xml.dist --coverage-html build/coverage-report --log-junit build/junit.xml
          environment:
            DB_HOST: 127.0.0.1
            DB_USERNAME: root

      - store_test_results:
          path: build

      - store_artifacts:
          path: build
